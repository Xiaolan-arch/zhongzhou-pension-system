# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.8.8
  # 版权年份
  copyrightYear: 2024
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: ${UPLOAD_PATH:D:/sxunkaifa/xitongkaifa/uploadPath}
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: ${SERVER_PORT:8080}
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  # redis 配置
  redis:
    # 地址
    host: ${REDIS_HOST:localhost}
    # 端口，默认为6379
    port: ${REDIS_PORT:6379}
    # 数据库索引
    database: ${REDIS_DATABASE:0}
    # 密码
    password: ${REDIS_PASSWORD:}
    # 连接超时时间
    timeout: 10s
    lettuce:
      pool:
        # 连接池中的最小空闲连接
        min-idle: 0
        # 连接池中的最大空闲连接
        max-idle: 8
        # 连接池的最大数据库连接数
        max-active: 8
        # #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: ${TOKEN_SECRET:abcdefghijklmnopqrstuvwxyz}
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Swagger配置
swagger:
  # 是否开启swagger
  enabled: true
  # 请求前缀
  pathMapping: /dev-api

# AI 健康报告
ai:
  report:
    # 模型提供方：mock（本地规则模版）/ qianfan（百度千帆）
    provider: mock
    # 千帆调用失败时是否自动降级为本地模拟
    fallback-to-mock: true
    qianfan:
      # 建议通过环境变量 QIANFAN_API_KEY 注入，留空则使用本地模拟
      api-key: ${QIANFAN_API_KEY:}
      endpoint: https://qianfan.baidubce.com/v2/chat/completions
      model: ernie-4.0-8k
      temperature: 0.7
      max-tokens: 2048
      timeout-seconds: 60
  # AI 智能客服（家属端聊天）
  chat:
    # 模型提供方：mock（本地规则）/ deepseek
    provider: ${AI_CHAT_PROVIDER:mock}
    # 真实模型调用失败时是否自动降级为本地模拟
    fallback-to-mock: true
    deepseek:
      # 建议通过环境变量 DEEPSEEK_API_KEY 注入，留空则使用本地模拟
      api-key: ${DEEPSEEK_API_KEY:}
      endpoint: https://api.deepseek.com/v1/chat/completions
      model: deepseek-chat
      temperature: 0.7
      max-tokens: 1024
      timeout-seconds: 60

# 微信小程序（订阅消息 / openid 绑定）
wx:
  miniapp:
    # 是否真实调用微信接口（演示环境保持 false）
    enabled: false
    # Mock 模式：只写入发送记录 biz_message_log，不真实调用微信接口
    mock: true
    # 小程序 AppID / AppSecret
    app-id: ${WX_MINIAPP_APPID:}
    app-secret: ${WX_MINIAPP_SECRET:}
    # 订阅消息模板ID（账单到期提醒 / 逾期提醒）
    bill-due-template: ${WX_TEMPLATE_BILL_DUE:}
    overdue-template: ${WX_TEMPLATE_OVERDUE:}

# 逾期账单滞纳金
bill:
  overdue:
    # 是否启用滞纳金计算
    enabled: true
    # 宽限期：账单周期结束后多少天开始计滞纳金
    grace-days: 30
    # 日费率（按未缴金额计算，0.0005 = 每日万分之五）
    daily-rate: 0.0005

# 报告归档存储
report:
  # 发票 PDF 中文字体路径（Windows 用 C:/Windows/Fonts/simhei.ttf，Linux 用 /usr/share/fonts/truetype/wqy-microhei.ttc）
  font:
    path: C:/Windows/Fonts/simhei.ttf
  storage:
    # 是否归档导出的 Word 文件
    enabled: true
    # 存储类型：local（本地 uploadPath）/ oss（阿里云 OSS）
    type: local
    dir: report
    oss:
      endpoint: ${OSS_ENDPOINT:}
      bucket: ${OSS_BUCKET:}
      access-key-id: ${OSS_ACCESS_KEY_ID:}
      access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
      prefix: zhongzhou/report/
      expire-seconds: 3600

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*
