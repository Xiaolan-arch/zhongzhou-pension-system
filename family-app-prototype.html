<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>中州颐养 · 家属端小程序原型</title>
<style>
  :root {
    --green: #2fa36b;
    --green-light: #5bc08d;
    --green-dark: #217a4f;
    --green-soft: #e8f6ee;
    --page: #f4f7f5;
    --card: #ffffff;
    --text: #1d2129;
    --text-2: #4e5969;
    --text-3: #8a94a6;
    --line: #edf1ee;
    --red: #f05a5a;
    --red-soft: #fdecec;
    --orange: #f2a65a;
    --orange-soft: #fdf3e7;
    --shadow: 0 4px 18px rgba(17, 44, 32, 0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(circle at 20% 0%, #eaf5ee 0%, #f6f9f7 38%, #eef2ef 100%);
    color: var(--text);
    min-height: 100vh;
  }
  .page-wrap {
    max-width: 1360px;
    margin: 0 auto;
    padding: 28px 24px 60px;
  }
  .topbar {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark {
    width: 46px; height: 46px; border-radius: 14px;
    background: linear-gradient(135deg, var(--green), var(--green-light));
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 20px;
    box-shadow: 0 6px 16px rgba(47, 163, 107, 0.28);
  }
  .brand h1 { font-size: 22px; letter-spacing: 0.5px; }
  .brand p { font-size: 13px; color: var(--text-3); margin-top: 2px; }
  .top-badges { display: flex; gap: 10px; flex-wrap: wrap; }
  .badge {
    font-size: 12px; padding: 7px 14px; border-radius: 999px;
    background: rgba(255,255,255,0.8); border: 1px solid #dce8e1; color: var(--green-dark);
  }
  .badge.plain { background: #fff; color: var(--text-2); border-color: var(--line); }

  .layout {
    display: grid;
    grid-template-columns: 232px minmax(420px, 1fr) 340px;
    gap: 28px;
    align-items: start;
  }
  .side, .notes {
    background: rgba(255, 255, 255, 0.86);
    border: 1px solid #e2ebe5;
    border-radius: 20px;
    padding: 18px;
    box-shadow: var(--shadow);
    position: sticky; top: 24px;
  }
  .side-title, .notes-title {
    font-size: 12px; letter-spacing: 2px; color: var(--text-3);
    text-transform: uppercase; margin: 4px 6px 10px;
  }
  .nav-group { margin-bottom: 16px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 12px; cursor: pointer;
    font-size: 14px; color: var(--text-2); transition: all .18s ease;
  }
  .nav-item:hover { background: var(--green-soft); color: var(--green-dark); }
  .nav-item.active { background: var(--green); color: #fff; box-shadow: 0 6px 14px rgba(47, 163, 107, 0.24); }
  .nav-item .dot { width: 7px; height: 7px; border-radius: 50%; background: #c3d6ca; flex: none; }
  .nav-item.active .dot { background: #fff; }
  .nav-item .tag { margin-left: auto; font-size: 10px; padding: 2px 7px; border-radius: 999px; background: #eef2ef; color: var(--text-3); }
  .nav-item.active .tag { background: rgba(255,255,255,0.22); color: #fff; }

  .phone-stage { display: flex; justify-content: center; }
  .phone {
    width: 390px; height: 844px;
    background: #14211b;
    border-radius: 46px;
    padding: 10px;
    box-shadow: 0 24px 60px rgba(17, 44, 32, 0.26), inset 0 0 0 2px rgba(255,255,255,0.06);
    position: relative;
  }
  .phone::before {
    content: ""; position: absolute; left: 50%; top: 16px; transform: translateX(-50%);
    width: 112px; height: 26px; background: #0b1410; border-radius: 999px; z-index: 20;
  }
  .screen {
    width: 100%; height: 100%; background: var(--page);
    border-radius: 38px; overflow: hidden; position: relative;
    display: flex; flex-direction: column;
  }
  .statusbar {
    height: 42px; flex: none; display: flex; align-items: center; justify-content: space-between;
    padding: 0 22px; font-size: 12px; color: #fff; position: relative; z-index: 10;
  }
  .statusbar.dark { color: var(--text); }
  .statusbar .right { display: flex; gap: 6px; align-items: center; }
  .sig { display: flex; gap: 2px; align-items: flex-end; }
  .sig i { display: block; width: 3px; background: currentColor; border-radius: 1px; }
  .sig i:nth-child(1){height:4px;} .sig i:nth-child(2){height:6px;} .sig i:nth-child(3){height:8px;} .sig i:nth-child(4){height:10px;}
  .battery { width: 22px; height: 10px; border: 1px solid currentColor; border-radius: 3px; position: relative; }
  .battery::after { content: ""; position: absolute; right: -4px; top: 2px; width: 2px; height: 4px; background: currentColor; border-radius: 1px; }
  .battery::before { content: ""; position: absolute; left: 1px; top: 1px; bottom: 1px; width: 12px; background: currentColor; border-radius: 2px; }

  .viewport {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    scrollbar-width: none;
  }
  .viewport::-webkit-scrollbar { display: none; }

  .tabbar {
    flex: none; height: 62px; display: flex; align-items: center;
    background: rgba(255,255,255,0.96); border-top: 1px solid var(--line);
    padding-bottom: 6px; backdrop-filter: blur(10px);
  }
  .tab {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 10px; color: #9aa6a0; cursor: pointer; user-select: none;
  }
  .tab .icon {
    width: 26px; height: 26px; border-radius: 9px; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600; background: #f0f4f1; color: #8b9a91;
  }
  .tab.active { color: var(--green-dark); font-weight: 600; }
  .tab.active .icon { background: var(--green-soft); color: var(--green-dark); }

  .hero { padding: 8px 22px 74px; color: #fff; background: linear-gradient(135deg, var(--green) 0%, var(--green-light) 100%); }
  .hero-row { display: flex; align-items: center; justify-content: space-between; }
  .hello { font-size: 24px; font-weight: 700; letter-spacing: 0.3px; }
  .hello-sub { margin-top: 4px; font-size: 13px; color: rgba(255,255,255,0.88); }
  .hero-chip {
    font-size: 11px; padding: 5px 10px; border-radius: 999px;
    background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.28); color: #fff;
  }
  .hero-note { margin-top: 18px; font-size: 11px; color: rgba(255,255,255,0.8); }

  .body { padding: 0 16px 20px; }
  .pull-up { margin-top: -58px; }
  .card { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 16px; margin-bottom: 12px; }
  .card-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .card-title { font-size: 15px; font-weight: 600; }
  .card-link { font-size: 12px; color: var(--green-dark); cursor: pointer; }

  .elder-main { display: flex; gap: 12px; align-items: center; }
  .avatar {
    width: 54px; height: 54px; border-radius: 16px; flex: none;
    background: linear-gradient(135deg, #d8f0e2, #b9e3cc);
    color: var(--green-dark); font-size: 22px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .elder-name { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .mini-tag { font-size: 10px; padding: 3px 8px; border-radius: 6px; background: var(--green-soft); color: var(--green-dark); font-weight: 500; }
  .elder-meta { margin-top: 6px; font-size: 12px; color: var(--text-3); }
  .elder-meta b { color: var(--text-2); font-weight: 500; }
  .nurse-row { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; font-size: 12px; color: var(--text-3); }
  .nurse-row b { color: var(--text-2); font-weight: 500; }

  .alert {
    display: flex; align-items: center; gap: 10px;
    background: var(--orange-soft); border: 1px solid #f7dfc3; border-radius: 14px;
    padding: 12px 14px; margin-bottom: 12px;
  }
  .alert-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--orange); flex: none; }
  .alert-text { font-size: 12px; color: #8a5a24; line-height: 1.5; flex: 1; }
  .alert-btn { font-size: 11px; color: #fff; background: var(--orange); padding: 6px 10px; border-radius: 8px; cursor: pointer; white-space: nowrap; }

  .stats { display: flex; background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 16px 8px; margin-bottom: 12px; }
  .stat { flex: 1; text-align: center; position: relative; }
  .stat + .stat::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 1px; background: var(--line); }
  .stat-val { font-size: 18px; font-weight: 700; color: var(--green-dark); }
  .stat-label { margin-top: 5px; font-size: 11px; color: var(--text-3); }

  .section-head { display: flex; align-items: center; justify-content: space-between; margin: 16px 2px 10px; }
  .section-title { font-size: 15px; font-weight: 600; }
  .section-tip { font-size: 11px; color: var(--text-3); }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .entry { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); padding: 14px; display: flex; gap: 10px; align-items: center; cursor: pointer; }
  .entry-icon { width: 38px; height: 38px; border-radius: 11px; background: var(--green-soft); color: var(--green-dark); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex: none; }
  .entry-title { font-size: 13px; font-weight: 600; }
  .entry-desc { margin-top: 3px; font-size: 10px; color: var(--text-3); }

  .notice-card { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 14px 16px; margin-top: 4px; }
  .notice-item { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--text-2); }
  .notice-item:last-child { border-bottom: none; }
  .notice-time { margin-left: auto; color: var(--text-3); font-size: 10px; white-space: nowrap; }
  .notice-mark { width: 6px; height: 6px; border-radius: 50%; background: var(--green); margin-top: 5px; flex: none; }

  .sub-header { display: flex; align-items: center; gap: 10px; padding: 6px 16px 12px; background: var(--card); border-bottom: 1px solid var(--line); position: relative; z-index: 5; }
  .back { width: 30px; height: 30px; border-radius: 50%; background: #f0f4f1; display: flex; align-items: center; justify-content: center; font-size: 15px; color: var(--text-2); cursor: pointer; }
  .sub-title { font-size: 15px; font-weight: 600; }
  .sub-tip { margin-left: auto; font-size: 10px; color: var(--text-3); }

  .chips { display: flex; gap: 8px; padding: 10px 16px 12px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { font-size: 12px; padding: 7px 13px; border-radius: 999px; background: #fff; border: 1px solid #e2ebe5; color: var(--text-2); white-space: nowrap; cursor: pointer; }
  .chip.active { background: var(--green); border-color: var(--green); color: #fff; }

  .list-card { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 10px; }
  .list-top { display: flex; align-items: center; justify-content: space-between; }
  .list-name { font-size: 14px; font-weight: 600; }
  .status { font-size: 10px; padding: 3px 8px; border-radius: 6px; }
  .status.ok { background: var(--green-soft); color: var(--green-dark); }
  .status.warn { background: var(--orange-soft); color: #a86a22; }
  .status.danger { background: var(--red-soft); color: var(--red); }
  .status.info { background: #eef1f5; color: #697686; }
  .row { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; color: var(--text-3); margin-top: 8px; }
  .row b { color: var(--text-2); font-weight: 500; }
  .feedback { margin-top: 10px; padding: 10px 12px; background: #f7faf8; border-radius: 10px; font-size: 11px; color: var(--text-2); line-height: 1.6; }
  .feedback span { color: var(--green-dark); font-weight: 500; }

  .bill-summary { background: linear-gradient(135deg, var(--green), var(--green-light)); border-radius: 18px; padding: 18px; color: #fff; box-shadow: 0 10px 24px rgba(47,163,107,0.22); margin-bottom: 12px; }
  .bill-summary .label { font-size: 12px; color: rgba(255,255,255,0.86); }
  .bill-summary .money { font-size: 30px; font-weight: 700; margin-top: 4px; letter-spacing: 0.5px; }
  .bill-summary .split { display: flex; justify-content: space-between; margin-top: 10px; font-size: 11px; color: rgba(255,255,255,0.86); }
  .bill-summary .penalty { margin-top: 8px; display: inline-block; font-size: 10px; padding: 4px 9px; border-radius: 6px; background: rgba(255,255,255,0.18); color: #ffe1b8; }

  .bill-card { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 10px; }
  .bill-card .top { display: flex; align-items: flex-start; justify-content: space-between; }
  .bill-month { font-size: 15px; font-weight: 700; }
  .bill-type { margin-top: 3px; font-size: 10px; color: var(--text-3); }
  .bill-amount { text-align: right; font-size: 20px; font-weight: 700; }
  .bill-amount small { display: block; font-size: 10px; font-weight: 400; color: var(--text-3); margin-top: 2px; }
  .bill-tags { display: flex; gap: 6px; }
  .bill-meta { display: flex; justify-content: space-between; margin-top: 10px; font-size: 11px; color: var(--text-3); }
  .penalty-row { margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: var(--orange-soft); display: flex; justify-content: space-between; font-size: 11px; color: #9a6323; }

  .quick-row { display: flex; gap: 10px; margin-top: 2px; }
  .quick-box { flex: 1; background: var(--card); border-radius: 14px; box-shadow: var(--shadow); padding: 14px; cursor: pointer; }
  .quick-box .q-label { font-size: 11px; color: var(--text-3); }
  .quick-box .q-value { margin-top: 5px; font-size: 17px; font-weight: 700; color: var(--green-dark); }
  .quick-box .q-desc { margin-top: 3px; font-size: 10px; color: var(--text-3); }

  .profile { display: flex; gap: 12px; align-items: center; padding: 18px; background: linear-gradient(135deg, var(--green), var(--green-light)); color: #fff; }
  .profile .avatar { background: rgba(255,255,255,0.24); color: #fff; }
  .profile-name { font-size: 19px; font-weight: 700; }
  .profile-sub { margin-top: 4px; font-size: 12px; color: rgba(255,255,255,0.86); }

  .menu-card { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; margin-bottom: 12px; }
  .menu-item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .menu-item:last-child { border-bottom: none; }
  .menu-icon { width: 32px; height: 32px; border-radius: 9px; background: var(--green-soft); color: var(--green-dark); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
  .menu-title { font-size: 14px; font-weight: 500; }
  .menu-desc { margin-top: 2px; font-size: 10px; color: var(--text-3); }
  .arrow { margin-left: auto; color: #b8c2bc; font-size: 14px; }
  .menu-group-title { font-size: 11px; color: var(--text-3); margin: 14px 4px 8px; }

  .balance-card { background: linear-gradient(135deg, var(--green), var(--green-light)); border-radius: 18px; color: #fff; padding: 20px; box-shadow: 0 10px 24px rgba(47,163,107,0.22); margin-bottom: 12px; }
  .balance-label { font-size: 12px; color: rgba(255,255,255,0.86); }
  .balance-value { font-size: 32px; font-weight: 700; margin-top: 4px; }
  .balance-note { margin-top: 10px; font-size: 11px; color: rgba(255,255,255,0.8); }

  .timeline { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 16px; }
  .tl-item { display: flex; gap: 12px; padding-bottom: 16px; position: relative; }
  .tl-item:last-child { padding-bottom: 0; }
  .tl-line { width: 12px; display: flex; flex-direction: column; align-items: center; flex: none; }
  .tl-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); flex: none; }
  .tl-dot.gray { background: #d5dfd9; }
  .tl-stem { width: 1px; flex: 1; background: #e7ede9; margin-top: 5px; }
  .tl-item:last-child .tl-stem { display: none; }
  .tl-content { flex: 1; }
  .tl-title { font-size: 13px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
  .tl-desc { margin-top: 4px; font-size: 11px; color: var(--text-3); line-height: 1.6; }
  .tl-amount { font-size: 14px; font-weight: 700; color: var(--green-dark); white-space: nowrap; }
  .tl-item.in .tl-amount { color: var(--green-dark); }
  .tl-item.out .tl-amount { color: var(--red); }

  .msg-item { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); padding: 14px; margin-bottom: 10px; cursor: pointer; }
  .msg-top { display: flex; align-items: center; gap: 8px; }
  .msg-type { font-size: 10px; padding: 3px 7px; border-radius: 5px; background: var(--green-soft); color: var(--green-dark); }
  .msg-type.warn { background: var(--orange-soft); color: #a86a22; }
  .msg-time { margin-left: auto; font-size: 10px; color: var(--text-3); }
  .msg-title { margin-top: 8px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .unread { width: 6px; height: 6px; border-radius: 50%; background: var(--red); }
  .msg-text { margin-top: 5px; font-size: 11px; color: var(--text-3); line-height: 1.6; }

  .invoice-card { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 18px; margin-bottom: 12px; }
  .invoice-head { text-align: center; padding-bottom: 14px; border-bottom: 1px dashed #dbe6df; }
  .invoice-title { font-size: 17px; font-weight: 700; letter-spacing: 2px; }
  .invoice-sub { margin-top: 4px; font-size: 10px; color: var(--text-3); }
  .invoice-row { display: flex; justify-content: space-between; padding: 9px 0; font-size: 12px; color: var(--text-3); border-bottom: 1px solid var(--line); }
  .invoice-row b { color: var(--text-2); font-weight: 500; }
  .invoice-total { display: flex; justify-content: space-between; margin-top: 12px; font-size: 15px; font-weight: 700; }
  .invoice-total span { color: var(--green-dark); }

  .score-card { background: linear-gradient(135deg, var(--green), var(--green-light)); border-radius: 18px; color: #fff; padding: 20px; margin-bottom: 12px; box-shadow: 0 10px 24px rgba(47,163,107,0.22); }
  .score-val { font-size: 42px; font-weight: 700; line-height: 1; }
  .score-desc { margin-top: 8px; font-size: 12px; color: rgba(255,255,255,0.88); }
  .metric-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
  .metric { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); padding: 14px 10px; text-align: center; }
  .metric-label { font-size: 10px; color: var(--text-3); }
  .metric-value { margin-top: 6px; font-size: 17px; font-weight: 700; color: var(--text); }
  .metric-unit { font-size: 9px; color: var(--text-3); margin-left: 2px; }
  .bars { display: flex; align-items: flex-end; gap: 5px; height: 54px; margin-top: 12px; }
  .bars i { flex: 1; border-radius: 3px 3px 0 0; background: linear-gradient(180deg, var(--green-light), var(--green)); opacity: .9; }

  .evaluate-card { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 16px; }
  .evaluate-card textarea { width: 100%; height: 74px; resize: none; border: 1px solid #e2ebe5; border-radius: 10px; padding: 10px; font-size: 12px; font-family: inherit; color: var(--text-2); outline: none; margin-top: 10px; background: #fbfdfc; }
  .rate-row { display: flex; gap: 8px; margin-top: 10px; }
  .rate { flex: 1; text-align: center; font-size: 12px; padding: 9px 0; border-radius: 9px; border: 1px solid #e2ebe5; color: var(--text-2); cursor: pointer; }
  .rate.active { border-color: var(--green); background: var(--green-soft); color: var(--green-dark); font-weight: 600; }
  .primary-btn { width: 100%; margin-top: 14px; padding: 13px; border: none; border-radius: 999px; background: var(--green); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .ghost-btn { width: 100%; margin-top: 10px; padding: 12px; border: 1px solid #dbe6df; border-radius: 999px; background: #fff; color: var(--text-2); font-size: 13px; cursor: pointer; font-family: inherit; }

  .notes .note-block { padding: 12px 6px; border-bottom: 1px solid var(--line); }
  .notes .note-block:last-child { border-bottom: none; }
  .note-label { font-size: 10px; letter-spacing: 1px; color: var(--text-3); margin-bottom: 6px; }
  .note-value { font-size: 12px; color: var(--text-2); line-height: 1.7; }
  .note-value code { font-size: 10px; background: #f1f5f2; padding: 2px 5px; border-radius: 4px; color: var(--green-dark); word-break: break-all; }
  .note-status { display: inline-block; margin-top: 6px; font-size: 10px; padding: 3px 8px; border-radius: 6px; }
  .note-status.have { background: var(--green-soft); color: var(--green-dark); }
  .note-status.new { background: var(--orange-soft); color: #a86a22; }

function tabbar(active) {
  const tabs = [
    { key: 'home', icon: '首', label: '首页' },
    { key: 'service', icon: '服', label: '服务' },
    { key: 'bill', icon: '费', label: '费用' },
    { key: 'mine', icon: '我', label: '我的' }
  ];
  return `
  <div class="tabbar">
    ${tabs.map(t => `
      <div class="tab ${t.key === active ? 'active' : ''}" data-goto="${t.key}">
        <div class="icon">${t.icon}</div><div>${t.label}</div>
      </div>`).join('')}
  </div>`;
}

const state = { current: 'home' };

function renderNav() {
  const groups = [['main', 'nav-main'], ['sub', 'nav-sub']];
  groups.forEach(([group, elId]) => {
    document.getElementById(elId).innerHTML = SCREENS.filter(s => s.group === group).map(s => `
      <div class="nav-item ${s.id === state.current ? 'active' : ''}" data-screen="${s.id}">
        <span class="dot"></span><span>${s.nav}</span>
        <span class="tag">${s.badge}</span>
      </div>`).join('');
  });
}

function renderNotes(screen) {
  const n = screen.notes;
  const statusMap = {
    have: ['已在现有功能中', 'have'],
    mix: ['部分已有 / 部分待新增', 'new'],
    new: ['建议新增', 'new']
  };
  const [label, cls] = statusMap[n.status] || ['', ''];
  document.getElementById('notes').innerHTML = `
    <div class="side-title">${screen.nav} · 设计说明</div>
    <div class="note-block">
      <div class="note-label">页面目标</div>
      <div class="note-value">${n.goal}</div>
    </div>
    <div class="note-block">
      <div class="note-label">承载的后端能力</div>
      <div class="note-value">${n.ability}</div>
    </div>
    <div class="note-block">
      <div class="note-label">对应接口</div>
      <div class="note-value"><code>${n.api}</code></div>
    </div>
    <div class="note-block">
      <div class="note-label">实现状态</div>
      <div class="note-value"><span class="note-status ${cls}">${label}</span></div>
    </div>
    <div class="note-block">
      <div class="note-label">边界说明</div>
      <div class="note-value">家属端只展示与自己绑定老人的数据；审批、收款、押金收退、房间床位维护等操作仍在 Web 后台完成。</div>
    </div>`;
}

function render() {
  const screen = SCREENS.find(s => s.id === state.current) || SCREENS[0];
  document.getElementById('screen').innerHTML = screen.html;
  renderNav();
  renderNotes(screen);
  const viewport = document.querySelector('.viewport');
  if (viewport) viewport.scrollTop = 0;
}

document.addEventListener('click', (e) => {
  const screenBtn = e.target.closest('[data-screen]');
  if (screenBtn) {
    state.current = screenBtn.getAttribute('data-screen');
    render();
    return;
  }
  const gotoBtn = e.target.closest('[data-goto]');
  if (gotoBtn) {
    const target = gotoBtn.getAttribute('data-goto');
    if (SCREENS.some(s => s.id === target)) {
      state.current = target;
      render();
    }
  }
});

render();
</script>
